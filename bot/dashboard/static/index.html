<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mymm Command Center</title>
    <style>
        body { margin: 0; background: #0a0a0c; color: #eee; font-family: 'Inter', sans-serif; overflow: hidden; }
        .container { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        .sidebar { background: #121216; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .viewer { flex-grow: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .stat-card { background: #1c1c21; padding: 10px; border-radius: 6px; font-size: 0.9em; }
        .feed { flex-grow: 1; overflow-y: auto; font-size: 0.8em; color: #aaa; border-top: 1px solid #333; padding-top: 10px; }
        .tag { display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 0.75em; margin-right: 5px; }
        .thought { background: #3b2b5e; color: #d1b3ff; }
        .game { background: #223322; color: #b3ffb3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2 style="margin:0; font-size: 1.2em; color: #ff5e00;">Mymm Agent</h2>
            <div id="stats" class="stat-card">Connecting...</div>
            <div id="live-feed" class="feed"></div>
        </div>
        <div class="viewer">
            <iframe id="spectator-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        const statsDiv = document.getElementById('stats');
        const feedDiv = document.getElementById('live-feed');
        const iframe = document.getElementById('spectator-frame');
        let currentGid = "";

        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "snapshot") {
                const agents = msg.data.agents;
                const firstAgent = Object.values(agents)[0];
                if (firstAgent) updateUI(firstAgent, msg.data.logs);
            }
        };

        function updateUI(agent, logs) {
            // Update Stats
            statsDiv.innerHTML = `
                <div><b>HP:</b> ${agent.hp} | <b>EP:</b> ${agent.ep}</div>
                <div><b>Loc:</b> ${agent.rg} | <b>Kills:</b> ${agent.kills}</div>
                <div><b>Action:</b> ${agent.last_action}</div>
            `;

            // Update Iframe if game ID changed
            if (agent.gid && agent.gid !== currentGid) {
                currentGid = agent.gid;
                // Reconstruct the full spectator URL
                const url = agent.spectator_url || `https://www.clawroyale.ai/games/spect/${agent.game_id}`;
                if (iframe.src !== url) iframe.src = url;
            }

            // Update Logs
            feedDiv.innerHTML = logs.slice(-15).reverse().map(l => {
                const typeClass = l.type === 'thought' ? 'thought' : 'game';
                return `<div><span class="tag ${typeClass}">${l.type}</span>${l.text}</div>`;
            }).join('');
        }
    </script>
</body>
</html>
